<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1C1E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Vault">
<title>The Vault — Members' Club</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<!-- All screens live in this template. {{name}} = value from VaultApp.renderVals() in app.js.
     <sc-if value> shows a block when true, <sc-for list as> repeats a block. See runtime.js. -->
<template id="app-template">
<div dir="{{dir}}" class="sk sk-combo" style="position: relative; width: 100%; max-width: 480px; margin: 0 auto; height: 100dvh; box-sizing: border-box; background: var(--ground); color: var(--text); display: flex; flex-direction: column; overflow: hidden; font-family: {{font}}; font-size: 15px; line-height: 26px">

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<div class="vscroll home" style="position: relative; flex-grow: 1; min-height: 0; overflow-y: auto; background: var(--ground)">

<div class="hero on-photo" style="position: relative; height: 800px; overflow: hidden; display: flex; flex-direction: column">
<div class="hmedia" style="position: absolute; inset: 0">
<img class="orig" src="assets/photos/hero-1.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{o0}}; transition: opacity .5s">
<img class="orig" src="assets/photos/hero-2.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{o1}}; transition: opacity .5s">
<img class="orig" src="assets/photos/dining.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{o2}}; transition: opacity .5s">
<div class="hov" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / .85) 0%, rgb(var(--ground-rgb) / .25) 22%, rgb(var(--ground-rgb) / .3) 40%, rgb(var(--ground-rgb) / .92) 68%, var(--ground) 100%)"></div>
</div>
<div class="hnav" style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px 0">
<div class="mk hmark logo-home" role="button" tabindex="0" onClick="{{x.logoHome}}" aria-label="The Vault" style="cursor: pointer; width: 42px; height: 43px; flex-shrink: 0; background: var(--accent-l)"></div>
<div class="hword" dir="ltr" style="display: none">THE VAULT</div>
<nav style="display: flex; align-items: center; gap: 11px; font-size: {{navSize}}; letter-spacing: {{track2}}">
<a href="#membership" onClick="{{x.pMembership}}" style="color: var(--text); text-decoration: none; padding: 12px 0">{{t.navMem}}</a>
<a href="#events" onClick="{{x.pEvents}}" style="color: var(--text); text-decoration: none; padding: 12px 0">{{t.navEve}}</a>
<a href="#experiences" onClick="{{x.pExperiences}}" style="color: var(--text); text-decoration: none; padding: 12px 0">{{t.navExp}}</a>
</nav>
<button type="button" class="vb menubtn" onClick="{{x.openMenu}}"><i></i><span>{{x.t.menu}}</span></button>
<button type="button" class="vb" onClick="{{toggleLang}}" aria-label="{{t.langAria}}" style="min-width: 44px; height: 40px; flex-shrink: 0; background: rgb(var(--ground-rgb) / .55); border: 1px solid rgb(var(--accent-rgb) / .8); border-radius: var(--radius); color: var(--accent-l); font-size: 13px; letter-spacing: 0.06em">{{t.langBtn}}</button>
</div>
<div class="meta" dir="ltr"><span>THE VAULT</span><span>TEHRAN</span><span>WHERE VALUE IS KEPT</span></div>
<div class="dial dial-hero" role="button" tabindex="0" aria-label="{{t.nextAria}}" onClick="{{nextSlide}}"><div class="dialspin" style="--a0: {{sPrev}}; --a1: {{sDeg}}"><img src="assets/img/dial-hero.png" alt=""></div><div class="mk dialmk"></div><div class="dialptr"></div></div>
<div class="htype" dir="ltr" style="display: none"><span>T</span><span>H</span><span>E</span><span></span><span></span><span>V</span><span>A</span><span>U</span><span>L</span><span>T</span></div>
<div class="hbody" style="position: relative; margin-top: auto; box-sizing: border-box; padding: 0 20px 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<div class="orn" style="width: 12px; height: 12px; background: var(--accent-l)"></div>
<div dir="ltr" style="font-family: 'Archivo', sans-serif; font-size: 11px; line-height: 16px; letter-spacing: 0.2em; color: var(--accent-l)">{{slide.eyebrow}}</div>
</div>
<h1 class="htitle ttl" dir="ltr" style="margin: 0; font-family: var(--display); font-weight: 400; font-size: 43px; line-height: 50px; text-align: {{startAlign}}"><span style="display: block; color: var(--text)">{{slide.a}}</span><span class="h2nd" style="display: block; color: var(--accent-l)">{{slide.b}}</span></h1>
<p style="margin: 0; min-height: 84px; font-size: 15.5px; line-height: 28px; color: rgb(var(--text-rgb) / .9)">{{slide.body}}</p>
<div class="hcta" style="display: flex; flex-direction: column; gap: 12px">
<button type="button" class="vb gold" onClick="{{goRequest}}" style="height: 54px; border: 0; border-radius: var(--radius); color: var(--btn-fg); font-size: 16px; font-weight: 600">{{t.ctaRequest}}</button>
<button type="button" class="vb line" onClick="{{goLogin}}" style="height: 54px; background: rgb(var(--ground-rgb) / .6); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--accent-l); font-size: 15px; font-weight: 500">{{t.memberLogin}}</button>
</div>
<div class="hslider" dir="ltr" style="align-self: center; display: flex; align-items: center; gap: 14px; padding-top: 4px">
<button type="button" class="vb" onClick="{{prevSlide}}" aria-label="{{t.prevAria}}" style="width: 44px; height: 44px; border-radius: 50%; background: rgb(var(--ground-rgb) / .6); border: 1px solid rgb(var(--accent-rgb) / .7); display: flex; align-items: center; justify-content: center"><span style="display: block; width: 8px; height: 8px; margin-left: 3px; border-top: 1.5px solid var(--accent-l); border-left: 1.5px solid var(--accent-l); transform: rotate(-45deg)"></span></button>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<div style="width: {{d.w}}; height: 4px; border-radius: var(--radius); background: {{d.bg}}"></div>
</sc-for>
<button type="button" class="vb" onClick="{{nextSlide}}" aria-label="{{t.nextAria}}" style="width: 44px; height: 44px; border-radius: 50%; background: rgb(var(--ground-rgb) / .6); border: 1px solid rgb(var(--accent-rgb) / .7); display: flex; align-items: center; justify-content: center"><span style="display: block; width: 8px; height: 8px; margin-right: 3px; border-top: 1.5px solid var(--accent-l); border-left: 1.5px solid var(--accent-l); transform: rotate(135deg)"></span></button>
</div>
</div>
</div>

<div class="mev" style="position: relative; padding: 28px 20px 0; box-sizing: border-box">
<div class="photo" style="position: relative; height: 330px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/member-events.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .6)"></div>
</div>
<div role="button" tabindex="0" onClick="{{x.pEvents}}" class="mevcard paper" style="position: relative; margin: -70px 0 0 0; margin-inline-start: 44px; background: var(--text); color: var(--ground); border-top: 3px solid var(--accent); padding: 18px 20px 20px; box-shadow: 0 14px 28px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 6px">
<div dir="ltr" style="font-family: var(--display); font-size: 22px; line-height: 30px; color: var(--panel); text-align: {{startAlign}}">Member Events</div>
<p style="margin: 0; font-size: 14px; line-height: 24px; color: var(--ground)">{{t.meBody}}</p>
</div>
</div>

<div class="panel on-panel statement" style="position: relative; margin-top: 44px; background: var(--panel); padding: 52px 26px 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.85"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgb(var(--panel-rgb) / .92) 34%, rgb(var(--panel-rgb) / .15) 100%)"></div>
<div class="mk" style="position: relative; width: 56px; height: 58px; background: var(--accent-l)"></div>
<p style="position: relative; margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: {{introSize}}; line-height: {{introLh}}; color: var(--text)">{{t.statement}}</p>
<button type="button" class="vb gold" onClick="{{goRequest}}" style="position: relative; height: 50px; padding: 0 30px; border: 0; border-radius: var(--radius); color: var(--btn-fg); font-size: 15px; font-weight: 600">{{t.ctaRequest}}</button>
</div>

<div id="experiences" class="sec exp" style="position: relative; padding: 52px 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.16; pointer-events: none"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 10px">
<div dir="ltr" style="font-family: 'Archivo', sans-serif; font-size: 11px; line-height: 16px; letter-spacing: 0.2em; color: var(--accent-l); text-align: {{startAlign}}">RESTAURANTS &amp; LOUNGES</div>
<h2 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 29px; line-height: 40px">{{t.expTitle}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 26px; color: rgb(var(--text-rgb) / .84)">{{t.expBody}}</p>
<a href="#benefits" onClick="{{x.pExperiences}}" style="align-self: flex-start; display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border: 1px solid var(--accent); border-radius: var(--radius); color: var(--accent-l); text-decoration: none; font-size: 14px; background: rgb(var(--ground-rgb) / .6)">{{t.seeBenefits}}</a>
</div>
<div class="photo" style="position: relative; height: 380px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/dining.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .6)"></div>
</div>
<div class="photo" style="position: relative; height: 380px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/bar.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .6)"></div>
</div>
</div>

<div id="events" class="panel on-panel events" style="position: relative; margin-top: 40px; background: var(--panel); padding: 48px 20px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.7"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / .2), rgb(var(--ground-rgb) / .7))"></div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div dir="ltr" style="font-family: 'Archivo', sans-serif; font-size: 11px; line-height: 16px; letter-spacing: 0.2em; color: var(--accent-l)">THE VAULT CALENDAR</div>
<h2 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 29px; line-height: 40px">{{t.calTitle}}</h2>
</div>
<div style="position: relative; border: 1px solid var(--accent); padding: 5px; background: var(--ground); box-shadow: 0 16px 32px rgba(0,0,0,.5)">
<div style="border: 1px solid rgb(var(--accent-rgb) / .45); padding: 4px 18px; display: flex; flex-direction: column">
<sc-for list="{{events}}" as="e" hint-placeholder-count="3">
<div role="button" tabindex="0" onClick="{{e.go}}" style="display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid {{e.line}}; cursor: pointer">
<div style="width: 62px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border-inline-end: 1px solid rgb(var(--accent-rgb) / .45); padding-inline-end: 14px">
<span style="font-family: {{numFont}}; font-size: 28px; line-height: 32px; color: var(--accent-l)">{{e.day}}</span>
<span style="font-size: 12px; line-height: 16px; color: rgb(var(--text-rgb) / .8)">{{e.month}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 26px">{{e.title}}</span>
<span style="font-size: 13px; line-height: 20px; color: rgb(var(--text-rgb) / .72)">{{e.place}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</div>

<div id="benefits" class="sec ben" style="position: relative; padding: 48px 20px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.16; pointer-events: none"></div>

<div class="card on-photo" role="button" tabindex="0" onClick="{{x.pGallery}}" style="position: relative; height: 400px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/gallery.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="ov" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / 0) 36%, rgb(var(--ground-rgb) / .94) 100%)"></div>
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .7)"></div>
<div class="txt" style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 14px; line-height: 18px; color: var(--accent-l)">I</span>
<h3 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 24px; line-height: 34px">{{t.c1}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 23px; color: rgb(var(--text-rgb) / .88)">{{t.c1d}}</p>
</div>
</div>

<div class="card on-photo" role="button" tabindex="0" onClick="{{x.pRestaurant}}" style="position: relative; height: 400px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/lounge.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="ov" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / 0) 36%, rgb(var(--ground-rgb) / .94) 100%)"></div>
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .7)"></div>
<div class="txt" style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 14px; line-height: 18px; color: var(--accent-l)">II</span>
<h3 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 24px; line-height: 34px">{{t.c2}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 23px; color: rgb(var(--text-rgb) / .88)">{{t.c2d}}</p>
</div>
</div>

<div class="card on-photo" role="button" tabindex="0" onClick="{{x.pMevents}}" style="position: relative; height: 400px; overflow: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.5)">
<img class="orig" src="assets/photos/events.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div class="ov" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / 0) 36%, rgb(var(--ground-rgb) / .94) 100%)"></div>
<div class="cardframe" style="position: absolute; inset: 8px; border: 1px solid rgb(var(--accent-rgb) / .7)"></div>
<div class="txt" style="position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bodoni Moda', serif; font-size: 14px; line-height: 18px; color: var(--accent-l)">III</span>
<h3 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 24px; line-height: 34px">{{t.c3}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 23px; color: rgb(var(--text-rgb) / .88)">{{t.c3d}}</p>
</div>
</div>
</div>

<div id="membership" class="panel on-panel membership" style="position: relative; margin-top: 64px; background: var(--panel); padding: 0 20px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.55"></div>
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(var(--ground-rgb) / .1) 0%, rgb(var(--ground-rgb) / .82) 100%)"></div>
<div class="mcard" style="position: relative; margin-top: -28px; height: 244px; overflow: hidden; border: 1px solid var(--accent); box-shadow: 0 18px 36px rgba(0,0,0,.55)">
<img src="assets/photos/membership-card.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div dir="ltr" style="font-family: 'Archivo', sans-serif; font-size: 11px; line-height: 16px; letter-spacing: 0.2em; color: var(--accent-l)">INVITATION ONLY</div>
<h2 class="ttl" style="margin: 0; font-family: {{titleFont}}; font-weight: {{titleW}}; font-size: 29px; line-height: 40px">{{t.readyTitle}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 26px; color: rgb(var(--text-rgb) / .9)">{{t.readyBody}}</p>
</div>
<button type="button" class="vb gold" onClick="{{goRequest}}" style="position: relative; height: 54px; border: 0; border-radius: var(--radius); color: var(--btn-fg); font-size: 16px; font-weight: 600">{{t.submitRequest}}</button>
</div>

<div class="foot" style="background: var(--ground); padding: 40px 24px 36px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; border-top: 1px solid var(--accent)">
<img class="lk-l" src="assets/img/lockup.png" alt="The Vault. Where value is kept." style="display: block; width: 190px; height: auto">
<img class="lk-d" src="assets/img/lockup-dark.png" alt="The Vault. Where value is kept." style="display: none; width: 190px; height: auto">
<div class="flinks"><a href="#membership" onClick="{{x.pMembership}}">{{t.flMem}}</a><a href="#events" onClick="{{x.pEvents}}">{{t.flEve}}</a><a href="#experiences" onClick="{{x.pExperiences}}">{{t.flExp}}</a><a href="#login" onClick="{{goLogin}}">{{t.memberLogin}}</a></div>
</div>

</div>
</sc-if>

<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<button type="button" class="vb sticky" onClick="{{goRequest}}" style="display: none">{{t.ctaRequest}}</button>
</sc-if>

<sc-if value="{{showBar}}" hint-placeholder-val="{{false}}">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.16; pointer-events: none"></div>
</sc-if>

<sc-if value="{{showBar}}" hint-placeholder-val="{{false}}">
<div class="bar" style="position: relative; height: 66px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: var(--ground); border-bottom: 1px solid rgb(var(--accent-rgb) / .55)">
<button type="button" class="vb" onClick="{{back}}" style="visibility: {{x.backVis}}; height: 44px; flex-shrink: 0; padding: 0 6px; background: transparent; border: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-l); font-size: 14px">
<span style="display: block; width: 9px; height: 9px; border-top: 1.5px solid var(--accent-l); border-left: 1.5px solid var(--accent-l); transform: rotate({{backRot}})"></span>
<span>{{t.prev}}</span>
</button>
<div style="flex-grow: 1; height: 1px; background: rgb(var(--accent-rgb) / .4)"></div>
<div class="mk logo-home" role="button" tabindex="0" onClick="{{x.logoHome}}" aria-label="The Vault" style="cursor: pointer; width: 40px; height: 41px; flex-shrink: 0; background: var(--accent)"></div>
<div style="flex-grow: 1; height: 1px; background: rgb(var(--accent-rgb) / .4)"></div>
<button type="button" class="vb" onClick="{{toggleLang}}" aria-label="{{t.langAria}}" style="min-width: 44px; height: 40px; flex-shrink: 0; background: transparent; border: 1px solid rgb(var(--accent-rgb) / .6); border-radius: var(--radius); color: var(--accent-l); font-size: 13px; letter-spacing: 0.06em">{{t.langBtn}}</button>
</div>
</sc-if>

<sc-if value="{{isStep}}" hint-placeholder-val="{{false}}">
<div class="step" style="position: relative; flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
<div class="band on-panel" style="position: relative; height: 50px; flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--accent)">
<div class="pat" style="position: absolute; inset: 0; opacity: 0.9"></div>
</div>
<div dir="{{dir}}" class="stepper" style="position: relative; flex-shrink: 0; margin-top: -21px; display: flex; justify-content: center; gap: 10px">
<sc-for list="{{segs}}" as="sg" hint-placeholder-count="5">
<div class="seg {{sg.cls}}" style="width: 42px; height: 42px; box-sizing: border-box; border-radius: 50%; background: {{sg.bg}}; border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--ground); display: flex; align-items: center; justify-content: center; font-family: 'Bodoni Moda', serif; font-size: 15px; line-height: 16px; color: {{sg.fg}}">{{sg.num}}</div>
</sc-for>
</div>
<div class="shead" style="flex-shrink: 0; box-sizing: border-box; padding: 14px 24px 0; display: flex; flex-direction: column; gap: 4px">
<div class="sprog"><i style="width: {{stepPct}}"></i></div>
<div class="scount" dir="ltr">{{stepCount}}</div>
<div class="dial dial-step" style="--a0: {{dialPrev}}; --a1: {{dialDeg}}"><img src="assets/img/dial-step.png" alt=""><div class="mk dialmk"></div><div class="dialptr"></div></div>
<div class="scount2">{{stepOf}}</div>
<div style="font-size: 12px; line-height: 18px; letter-spacing: {{track}}; color: var(--accent-l)">{{t.formEyebrow}}</div>
