<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Vault">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<title>The Vault</title>
<link rel="stylesheet" href="v2.css">
</head>
<body>
<div id="app" class="app" data-screen="door">

  <!-- top bar: monogram (always goes home), sound, language -->
  <header class="bar">
    <button type="button" class="mono" data-act="home" aria-label="The Vault — home"><span class="mk"></span></button>
    <div class="bar-r">
      <button type="button" class="ibtn" data-act="sound" aria-pressed="true"><span class="i-sound" aria-hidden="true"></span><span class="sr" data-t="sound"></span></button>
      <button type="button" class="ibtn lang" data-act="lang" data-t="langBtn"></button>
    </div>
  </header>

  <!-- ===== the door: landing + unlock share one stage ===== -->
  <section class="scene" aria-label="The Vault">
    <div class="glowback" aria-hidden="true"></div>

    <div class="stage">
      <div class="frame" aria-hidden="true">
        <div class="frame-ring"></div>
        <div class="vault-light"></div>
      </div>

      <div class="door" id="door">
        <div class="door-depth" aria-hidden="true"></div>
        <div class="bolts" aria-hidden="true"></div>
        <div class="door-face">
          <svg class="engrave" viewBox="0 0 400 400" aria-hidden="true">
            <defs><path id="rim" d="M200,200 m-152,0 a152,152 0 1,1 304,0 a152,152 0 1,1 -304,0"/></defs>
            <text><textPath href="#rim" startOffset="0">THE VAULT · TEHRAN · WHERE VALUE IS KEPT · MEMBERS ONLY · MMXXVI ·</textPath></text>
          </svg>
          <div class="handle" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="dial" id="dial" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0">
            <svg class="dial-svg" viewBox="0 0 200 200" aria-hidden="true"><g id="dialFace"></g></svg>
            <div class="dial-cap"><span class="mk"></span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- landing copy -->
    <div class="panel p-door">
      <p class="eyb" data-t="eyebrow"></p>
      <h1 class="title" data-t="title"></h1>
      <p class="hint" data-t="spin"></p>
      <div class="ctas">
        <button type="button" class="btn gold" data-act="login" data-t="members"></button>
        <a class="btn line" href="../?screen=s1" data-t="request" data-href-fa="../?screen=s1&lang=fa"></a>
      </div>
    </div>

    <!-- step 1: mobile number -->
    <div class="panel p-phone">
      <h2 class="title sm" data-t="loginTitle"></h2>
      <p class="body" data-t="loginBody"></p>
      <label class="field">
        <span class="lab" data-t="mobile"></span>
        <span class="phone">
          <select class="cc" aria-label="Country code" data-act-change="cc"></select>
          <input class="inp" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="0912 345 6789" dir="ltr">
        </span>
      </label>
      <button type="button" class="btn gold" data-act="send" data-t="send"></button>
    </div>

    <!-- step 2: the combination -->
    <div class="panel p-combo">
      <p class="eyb" data-t="comboEy"></p>
      <div class="slots" dir="ltr" aria-live="polite"><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>
      <p class="body" data-t="comboBody"></p>
      <div class="typed" hidden>
        <div class="typed-in" dir="ltr">
          <input class="inp" inputmode="numeric" maxlength="2" autocomplete="one-time-code" aria-label="1">
          <input class="inp" inputmode="numeric" maxlength="2" aria-label="2">
          <input class="inp" inputmode="numeric" maxlength="2" aria-label="3">
        </div>
        <button type="button" class="btn gold" data-act="typedOpen" data-t="open"></button>
      </div>
      <div class="links">
        <button type="button" class="link" data-act="typeInstead" data-t="typeInstead"></button>
        <button type="button" class="link" data-act="login" data-t="changeNum"></button>
      </div>
    </div>
  </section>

  <!-- ===== inside the vault: member home ===== -->
  <section class="inside" aria-label="Member home">
    <div class="inside-scroll">
      <div class="greet">
        <p class="eyb" data-t="memberNo"></p>
        <h1 class="title" id="greet"></h1>
      </div>

      <div class="card-stage">
        <div class="card" id="card" tabindex="0" aria-label="Membership card">
          <div class="card-pat"></div>
          <div class="card-chip"><span class="mk"></span></div>
          <div class="card-word">THE VAULT</div>
          <div class="card-meta" dir="ltr"><span>ARASH FARAHANI</span><span>Nº 001</span></div>
          <div class="card-glare"></div>
        </div>
      </div>

      <button type="button" class="next" data-box="0">
        <span class="next-k" data-t="nextK"></span>
        <span class="next-v" data-t="nextV"></span>
      </button>

      <div class="boxes" id="boxes"></div>

      <button type="button" class="btn line lock" data-act="lock"><span class="i-lock" aria-hidden="true"></span><span data-t="lock"></span></button>
    </div>
  </section>

  <!-- sheet that slides up when a deposit box is opened -->
  <div class="sheet-back" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <span class="sheet-no" id="sheetNo"></span>
      <h2 class="title sm" id="sheetTitle"></h2>
      <button type="button" class="ibtn x" data-act="closeSheet" data-t-aria="close">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>
</div>

<script src="v2.js"></script>
</body>
</html>
