<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Vault">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="preload" href="fonts/awaken.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<title>The Vault</title>
<link rel="stylesheet" href="v2.css?v=14">
</head>
<body>
<div id="app" class="app">
  <div class="world" aria-hidden="true"></div>

  <!-- the door: landing, login and the combination share it -->
  <div class="scene" aria-hidden="true">
    <div class="stage" id="stage">
      <div class="halo"></div>
      <div class="frame"></div>
      <div class="within"><div class="rays"></div><div class="vlogo"><span class="vm"></span><span class="vw">THE VAULT</span><span class="vt">WHERE VALUE IS KEPT</span></div></div>
      <div class="recess"></div>
      <div class="hinge h1"></div><div class="hinge h2"></div>
      <div class="door">
        <div class="depth"></div>
        <div class="bolts"></div>
        <div class="face">
          <div class="sheen"></div>
          <svg class="engrave" viewBox="0 0 400 400"><defs><path id="rim" d="M200,200 m-152,0 a152,152 0 1,1 304,0 a152,152 0 1,1 -304,0"/></defs><text><textPath href="#rim">THE VAULT · TEHRAN · WHERE VALUE IS KEPT · MEMBERS ONLY · MMXXVI ·</textPath></text></svg>
          <div class="handle"><i></i><i></i><i></i></div>
          <div class="index"></div>
          <div class="dial" id="dial" role="slider" aria-label="Combination dial" tabindex="-1" aria-valuemin="0" aria-valuemax="99" aria-valuenow="0">
            <svg class="dial-svg" viewBox="0 0 200 200"><g id="dialFace"></g></svg>
            <div class="cap"><span class="mk"></span></div>
          </div>
          <div class="shade"></div>
        </div>
      </div>
    </div>
  </div>

  <header class="bar" id="bar"></header>
  <main class="view" id="view"></main>
  <nav class="dock" id="dock" aria-label="Member"></nav>

  <div class="sheet-back" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 class="h2" id="sheetT"></h2><button type="button" class="ibtn" data-act="close" id="sheetX">×</button></div>
    <div class="sheet-body" id="sheetB"></div>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
</div>
<script src="v2.js?v=14"></script>
</body>
</html>
